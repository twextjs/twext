name: "Twext"
command: "twext"
version: "2.0.0"
tagline: "Build custom TurboWarp extensions with JavaScript modules (ESM)."
author: "Twext Team"
homepage: "https://github.com/twext/twext"
symbols:
  success: "✓"
  error: "✗"
  progress: "~"
  bullet: "•"
defaults:
  configFilename: "twext.yml"
  outputDirectory: "dist"
  devPort: 8000
  fallbackColor: "#0070F3"
